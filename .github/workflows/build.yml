name: Build IPA for AltStore
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r bridge/requirements.txt pytest httpx
      - run: python -m pytest tests -q
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for iPhone
        run: >-
          xcodebuild -project CasaControl.xcodeproj -scheme CasaControl
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p output/Payload
          cp -R build/Build/Products/Release-iphoneos/CasaControl.app output/Payload/
          test -f output/Payload/CasaControl.app/CasaControl
          cd output
          zip -r CasaControl.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CasaControl-AltStore
          path: output/CasaControl.ipa
          if-no-files-found: error
